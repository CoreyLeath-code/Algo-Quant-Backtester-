name: CI

on:
  push:
    branches: [main, development, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algoquant-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }} quality & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile and lint
        run: |
          python -m compileall -q algoquant tests
          ruff check algoquant tests
      - name: Run tests with fail-closed coverage gate
        run: |
          python -m pytest tests -v \
            --cov=algoquant \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}-test-evidence
          path: |
            coverage.xml
            pytest-results.xml
          if-no-files-found: error

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install wheel and run CLI smoke test
        run: |
          python -m pip install dist/*.whl
          algoquant-backtest --rows 256 --seed 20260828
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  benchmark:
    name: Reproducible development benchmark
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run fixed benchmark protocol
        run: |
          python -m algoquant.benchmark \
            --rows 5000 \
            --iterations 50 \
            --warmups 5 \
            --seed 20260828 \
            --output benchmark-results.json
          cat benchmark-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: benchmark-results.json
          if-no-files-found: error

  container:
    name: Container build & smoke test
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t algoquant-backtester:${{ github.sha }} .
      - name: Run deterministic container smoke test
        run: docker run --rm algoquant-backtester:${{ github.sha }} --rows 256 --seed 20260828

  release-readiness:
    name: Release readiness contract
    if: always()
    needs: [quality-and-tests, package, benchmark, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require all evidence jobs
        env:
          QUALITY: ${{ needs.quality-and-tests.result }}
          PACKAGE: ${{ needs.package.result }}
          BENCHMARK: ${{ needs.benchmark.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          test "$QUALITY" = "success"
          test "$PACKAGE" = "success"
          test "$BENCHMARK" = "success"
          test "$CONTAINER" = "success"
